name: Build Android & Tablet Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version tag/name'
        required: true
        type: string
        default: '0.6.5-cast.5'

permissions:
  contents: write

jobs:
  build_android:
    name: Build & Sign Android APKs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_VERSION: ${{ inputs.version_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Android Signing & Keystore
        run: |
          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode | tr -d '\r' > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\nsdk.dir=%s\n' "${keystore_path}" "${ANDROID_HOME}" >> local.properties
          
          # Extract passwords from decrypted secret and mask them in logs
          STORE_PASS=$(grep '^NUVIO_RELEASE_STORE_PASSWORD=' local.properties | cut -d'=' -f2-)
          KEY_PASS=$(grep '^NUVIO_RELEASE_KEY_PASSWORD=' local.properties | cut -d'=' -f2-)
          KEY_ALIAS=$(grep '^NUVIO_RELEASE_KEY_ALIAS=' local.properties | cut -d'=' -f2-)
          
          echo "::add-mask::${STORE_PASS}"
          echo "::add-mask::${KEY_PASS}"
          
          echo "NUVIO_RELEASE_STORE_FILE=${keystore_path}" >> $GITHUB_ENV
          echo "NUVIO_RELEASE_STORE_PASSWORD=${STORE_PASS}" >> $GITHUB_ENV
          echo "NUVIO_RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV
          echo "NUVIO_RELEASE_KEY_PASSWORD=${KEY_PASS}" >> $GITHUB_ENV

      - name: Build Full Android & Tablet APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullRelease -Pnuvio.app.versionName="${RELEASE_VERSION}" --stacktrace

      - name: Collect Release APKs
        run: |
          mkdir -p release-apks
          find androidApp/build/outputs/apk/full/release -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_VERSION}" release-apks/*.apk \
            --title "Nuvio Mobile (Android & Tablet) ${RELEASE_VERSION}" \
            --notes "Nuvio Mobile con soporte NuvioCast para Smart TV Legacy" \
            --target "${{ github.ref_name }}"
